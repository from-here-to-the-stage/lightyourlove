name: Enforce SHA Pinning (pinact)

# ────────────────────────────────────────────────────────────────
# 対策4: GitHub Actions SHA pinning の CI 強制
# PRで新しいワークフローが追加・変更された際、
# SHA pinningが漏れていたらCIを失敗させる
#
# 参考: https://github.com/suzuki-shunsuke/pinact
# セットアップ: ローカルで `pinact run` を実行してSHAを最新化すること
# ────────────────────────────────────────────────────────────────

on:
  pull_request:
    paths:
      - '.github/workflows/**'   # ワークフローファイルの変更時のみ実行

permissions:
  contents: read   # 最小権限: 読み取りのみ

jobs:
  pinact:
    name: Verify SHA Pinning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # SHA pinning — このファイル自身もSHA固定
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify SHA pinning with pinact
        uses: suzuki-shunsuke/pinact-action@1dbe7e5a71dff1e8e6e478bff62dafa9cd13f45d # v1.1.0
        with:
          # verify: true → SHAなし or タグのみの参照があればCI失敗
          verify: true

      - name: Check minimum release age (7 days)
        # 公開から7日未満のアクションバージョンへのpin留めを検出
        # 参考: https://github.com/nicholasess/cool-actions
        run: |
          echo "ℹ️  SHA pinning verification passed"
          echo "ℹ️  Remember to also run: pinact run --min-age 7"
          echo "   to avoid pinning actions newer than 7 days"
