name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group:            pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve SITE_URL
        id: site
        run: |
          echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"

      - name: Prepare dist
        run: |
          mkdir -p dist
          [ -f "index.html" ] && cp index.html dist/
          [ -f "styles.css" ] && cp styles.css dist/
          [ -f "app.js" ]     && cp app.js dist/
          [ -f "tour-data.js" ] && cp tour-data.js dist/
          if [ -d "icons" ]; then cp -r icons dist/; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
