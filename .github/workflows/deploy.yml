name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group:             pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve SITE_URL
        id: site
        env:
          SITE_URL_VAR: ${{ vars.SITE_URL }}
        run: |
          OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.repository }}"  | cut -d'/' -f2)
          SITE_URL="${SITE_URL_VAR:-https://${OWNER}.github.io/${REPO}}"
          SITE_URL="${SITE_URL%/}"
          echo "site_url=${SITE_URL}" >> "$GITHUB_OUTPUT"

      - name: Prepare dist
        run: |
          mkdir -p dist/tokens
          if [ -f "index.html" ]; then cp index.html dist/index.html; fi
          for f in robots.txt sitemap.xml app.webmanifest; do
            [ -f "$f" ] && cp "$f" dist/
          done

      - name: Generate SDS-v2 daily salt
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d 2>/dev/null || date -u -d '+9 hours' +%Y-%m-%d)
          TOMORROW=$(date -u -d '+1 day' +%Y-%m-%dT00:00:00Z 2>/dev/null || date -u -v+1d +%Y-%m-%dT00:00:00Z)
          if [ -z "${SIGN_KEY}" ]; then echo "Error: SIGN_KEY is empty" && exit 1; fi
          SALT=$(printf '%s%s%s' "${SIGN_KEY}" "daily" "${DATE}" | openssl dgst -sha256 -hex | awk '{print $2}')
          printf '{"date":"%s","salt":"%s","token":"%s","expires":"%s","v":2}\n' "${DATE}" "${SALT}" "${SALT}" "${TOMORROW}" > "dist/tokens/${DATE}.json"
          
          shopt -s nullglob
          CUTOFF=$(date -d '-7 days' +%Y-%m-%d 2>/dev/null || date -u -v-7d +%Y-%m-%d)
          for f in dist/tokens/*.json; do
            FNAME=$(basename "$f" .json)
            if [[ "$FNAME" < "$CUTOFF" ]]; then rm "$f"; fi
          done

      - name: Generate signed manifest
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          KEY=$(printf '%s%s' "${SIGN_KEY}" "${DATE}" | openssl dgst -sha256 -hex | awk '{print $2}')
          printf '{"date":"%s","k":"%s","v":1}\n' "${DATE}" "${KEY}" > dist/manifest.json

      - name: Inject SITE_URL
        env:
          SITE_URL: ${{ steps.site.outputs.site_url }}
        run: |
          for f in dist/index.html dist/sitemap.xml dist/robots.txt; do
            [ -f "$f" ] && sed -i "s|%%SITE_URL%%|${SITE_URL}|g" "$f"
          done

      - name: Robust Injection (Python)
        env:
          GA4_ID: ${{ secrets.GA4_ID }}
          GAS_URL: ${{ secrets.GAS_URL }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          python3 - <<'PYEOF'
          import os
          def replace_placeholder(file_path, placeholder, value):
              if not os.path.exists(file_path): return
              with open(file_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              new_content = content.replace(placeholder, value if value else "")
              with open(file_path, 'w', encoding='utf-8') as f:
                  f.write(new_content)

          ga_id = os.environ.get('GA4_ID', '')
          ga_script = ""
          if ga_id:
              ga_script = f'<script async src="https://www.googletagmanager.com/gtag/js?id={ga_id}"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){{dataLayer.push(arguments);}}gtag("js",new Date());gtag("config","{ga_id}");</script>'
          
          replace_placeholder('dist/index.html', '', ga_script)
          replace_placeholder('dist/index.html', '%%GAS_URL%%', os.environ.get('GAS_URL', ''))
          replace_placeholder('dist/index.html', '%%WORKER_URL%%', os.environ.get('WORKER_URL', ''))
          PYEOF

      - name: Security Audit
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          if [ -n "${SIGN_KEY}" ] && grep -rq "${SIGN_KEY}" dist/; then
            echo "🚨 SECURITY ALERT: SIGN_KEY leaked!"
            exit 1
          fi

      - name: Final Validation
        run: |
          # 誤検知を避けるため、特定の変数パターンのみをチェック
          # HTMLコメントのGA4_SCRIPTと、%%大文字英数字%% の形式を探す
          TARGET_PATTERN='|%%[A-Z0-9_]{3,}%%'
          if grep -E "$TARGET_PATTERN" dist/index.html; then
            echo "🚨 ERROR: Unreplaced placeholders found!"
            grep -E "$TARGET_PATTERN" dist/index.html
            exit 1
          fi
          echo "✅ Validation passed."

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
