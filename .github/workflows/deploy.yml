name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group:            pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve SITE_URL
        id: site
        env:
          SITE_URL_VAR: ${{ vars.SITE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$SITE_URL_VAR" ]; then
            OWNER=$(echo $GITHUB_REPOSITORY | cut -d'/' -f1)
            REPO=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)
            echo "url=https://$OWNER.github.io/$REPO" >> $GITHUB_OUTPUT
          else
            echo "url=$SITE_URL_VAR" >> $GITHUB_OUTPUT
          fi

      - name: Build
        env:
          GA4_ID:     ${{ secrets.GA4_ID }}
          SIGN_KEY:   ${{ secrets.SIGN_KEY }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          GAS_URL:    ${{ secrets.GAS_URL }}
          SITE_URL:   ${{ steps.site.outputs.url }}
        run: |
          mkdir -p dist
          cp -r * dist/ 2>/dev/null || true
          rm -rf dist/dist dist/.git dist/.github

          # 🚨 地獄を終わらせる安全な sed の実行方法
          # 's|検索|置換|g' の形式を崩さないよう、シェル変数を引用符で厳重に囲みます。
          
          # GA4_ID の置換
          sed -i "s|%%GA4_ID%%|${GA4_ID:-G-XXXXXXXXXX}|g" dist/index.html
          
          # SITE_URL の置換
          sed -i "s|%%SITE_URL%%|${SITE_URL:-https://localhost}|g" dist/index.html
          
          # WORKER_URL の置換
          sed -i "s|%%WORKER_URL%%|${WORKER_URL:-#}|g" dist/index.html
          
          # GAS_URL の置換
          sed -i "s|%%GAS_URL%%|${GAS_URL:-#}|g" dist/index.html
          
          # GA4_SCRIPT 置換
          GA4_TAG="<script async src='https://www.googletagmanager.com/gtag/js?id=${GA4_ID:-G-XXXXXXXXXX}'></script>"
          sed -i "s||${GA4_TAG}|g" dist/index.html

          # 4. HMAC署名 (SIGN_KEYが空でもopensslがエラーにならないよう処理)
          DATE=$(date +%Y-%m-%d)
          if [ -n "$SIGN_KEY" ]; then
            # stdoutのみを取得する安全なパイプ
            DAILY_TOKEN=$(echo -n "${SIGN_KEY}${DATE}" | openssl dgst -sha256 -hex | awk '{print $NF}')
          else
            DAILY_TOKEN="offline-mode-token"
          fi
          sed -i "s|%%DAILY_TOKEN%%|${DAILY_TOKEN}|g" dist/index.html

      - name: Security Audit
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          if [ -n "$SIGN_KEY" ] && grep -rq "$SIGN_KEY" dist/ 2>/dev/null; then
            echo "SECURITY FAIL: SIGN_KEY leaked"
            exit 1
          fi

      - name: Validate placeholders
        run: |
          # 最終チェック（GA4_SCRIPT以外の未置換%%を検知）
          REMAINING=$(grep '%%' dist/index.html | grep -v '%%GA4_SCRIPT%%' || true)
          if [ -n "$REMAINING" ]; then
            echo "Error: Some placeholders were not replaced."
            echo "$REMAINING"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4