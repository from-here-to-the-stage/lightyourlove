name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group:            pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. チェックアウト (v4.2.2)
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 

      # 2. SITE_URL 決定
      - name: Resolve SITE_URL
        id: site
        env:
          SITE_URL_VAR: ${{ vars.SITE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "$SITE_URL_VAR" ]; then
            echo "url=$SITE_URL_VAR" >> $GITHUB_OUTPUT
          else
            OWNER=$(echo $GITHUB_REPOSITORY | cut -d'/' -f1)
            REPO=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)
            echo "url=https://$OWNER.github.io/$REPO" >> $GITHUB_OUTPUT
          fi

      # 3. ビルド環境準備 (dist作成)
      - name: Build
        env:
          GA4_ID:     ${{ secrets.GA4_ID }}
          SIGN_KEY:   ${{ secrets.SIGN_KEY }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SITE_URL:   ${{ steps.site.outputs.url }}
        run: |
          mkdir -p dist
          cp -r * dist/ 2>/dev/null || true
          rm -rf dist/dist dist/.git dist/.github
          sed -i "s|%%GA4_ID%%|${GA4_ID}|g" dist/index.html
          sed -i "s|%%SITE_URL%%|${SITE_URL}|g" dist/index.html
          sed -i "s|%%WORKER_URL%%|${WORKER_URL}|g" dist/index.html
          DATE=$(date +%Y-%m-%d)
          DAILY_TOKEN=$(echo -n "${SIGN_KEY}${DATE}" | openssl dgst -sha256 -hex | cut -d' ' -f2)
          sed -i "s|%%DAILY_TOKEN%%|${DAILY_TOKEN}|g" dist/index.html

      # 4. セキュリティ監査
      - name: Security Audit
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          FAIL=0
          if [ -n "${SIGN_KEY:-}" ] && grep -rq "${SIGN_KEY}" dist/ 2>/dev/null; then
            echo "SECURITY FAIL: SIGN_KEY found in dist"
            FAIL=1
          fi
          [ "$FAIL" -eq 0 ] && echo "Security audit passed"
          exit $FAIL

      # 5. Setup Pages (v5.0.0 正式ハッシュ)
      - name: Setup Pages
        uses: actions/configure-pages@1fb3643d0cd09d44e456165c7477d2473420040e 

      # 6. Upload artifact (v3.0.1 正式ハッシュ)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa 
        with:
          path: dist

      # 7. Deploy to GitHub Pages (v4.0.5 正式ハッシュ)
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0154846585c7e19