name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group:            pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve SITE_URL
        id: site
        env:
          SITE_URL_VAR: ${{ vars.SITE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$SITE_URL_VAR" ]; then
            OWNER=$(echo $GITHUB_REPOSITORY | cut -d'/' -f1)
            REPO=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)
            echo "url=https://$OWNER.github.io/$REPO" >> $GITHUB_OUTPUT
          else
            echo "url=$SITE_URL_VAR" >> $GITHUB_OUTPUT
          fi

      - name: Build
        env:
          GA4_ID:     ${{ secrets.GA4_ID }}
          SIGN_KEY:   ${{ secrets.SIGN_KEY }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          GAS_URL:    ${{ secrets.GAS_URL }}
          SITE_URL:   ${{ steps.site.outputs.url }}
        run: |
          mkdir -p dist
          cp -r * dist/ 2>/dev/null || true
          rm -rf dist/dist dist/.git dist/.github

          # 🛡️ sedの自爆を防ぐためPerlを使用。変数が空でもエラーになりません。
          TARGET="dist/index.html"
          
          perl -i -pe "s|%%GA4_ID%%|\$ENV{GA4_ID} // 'G-XXXXXXXXXX'|ge" "$TARGET"
          perl -i -pe "s|%%SITE_URL%%|\$ENV{SITE_URL} // ''|ge" "$TARGET"
          perl -i -pe "s|%%WORKER_URL%%|\$ENV{WORKER_URL} // ''|ge" "$TARGET"
          perl -i -pe "s|%%GAS_URL%%|\$ENV{GAS_URL} // ''|ge" "$TARGET"
          
          # GA4タグ置換
          GA4_TAG="<script async src='https://www.googletagmanager.com/gtag/js?id=${GA4_ID}'></script>"
          export GA4_TAG
          perl -i -pe "s||\$ENV{GA4_TAG}|g" "$TARGET"

          # 署名生成ロジック
          DATE=$(date +%Y-%m-%d)
          if [ -n "$SIGN_KEY" ]; then
            DAILY_TOKEN=$(echo -n "${SIGN_KEY}${DATE}" | openssl dgst -sha256 -hex | awk '{print $NF}')
          else
            DAILY_TOKEN="static-token"
          fi
          export DAILY_TOKEN
          perl -i -pe "s|%%DAILY_TOKEN%%|\$ENV{DAILY_TOKEN}|g" "$TARGET"

      - name: Security Audit
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          if [ -n "$SIGN_KEY" ] && grep -rq "$SIGN_KEY" dist/ 2>/dev/null; then
            echo "SECURITY FAIL: SIGN_KEY leaked"
            exit 1
          fi

      - name: Validate placeholders
        run: |
          # 致命的な未置換プレースホルダー（%%...%%）の残存をチェック
          REMAINING=$(grep '%%' dist/index.html | grep -v '%%GA4_SCRIPT%%' || true)
          if [ -n "$REMAINING" ]; then
            echo "Error: Unreplaced placeholders detected."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4