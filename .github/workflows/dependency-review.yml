name: Dependency Review

# ────────────────────────────────────────────────────────────────
# 対策5: 脆弱な依存関係をPRマージ前にブロック
# PRで追加・変更される依存関係をスキャンし、
# 既知の脆弱性があればCIを失敗させる
#
# このプロジェクトはCDN経由のJSライブラリを使用しているが、
# 将来 npm/package.json を追加した場合に自動的に有効になる
#
# ブランチ保護設定:
#   Settings → Branches → Branch protection rules → main
#   "Require status checks to pass before merging" に
#   "Dependency Review" を追加すること
# ────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]

permissions:
  contents: read   # 最小権限

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # moderate以上の脆弱性があればCIを失敗
          fail-on-severity: moderate

          # ライセンス制限: GPL系はファンプロジェクトでも要注意
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

          # 7日以内に公開されたパッケージへの更新を警告
          # (クールダウン対策1と同等)
          warn-on-openssf-scorecard-level: 4
